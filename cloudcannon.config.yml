# cloudcannon.config.yml - VERSION CORRIGÉE POUR STANDARD JEKYLL

collections_config:
  # Configuration de la collection "Posts" (Vos Analyses)
  posts:
    path: "_posts"           # On pointe vers le dossier standard Jekyll
    output: true             # On active la génération de pages HTML
    permalink: /analyses/:slug/  # Structure d'URL propre (ex: /analyses/ia-ohada/)
    name: "Analyses"
    icon: library_books
    description: "Vos publications juridiques et analyses stratégiques."
    _enabled_editors:
      - visual
      - content
    
    # Définition des champs dans l'interface CloudCannon
    _inputs:
      title:
        label: "Titre de l'analyse"
        type: text
      date:
        label: "Date de publication"
        type: datetime
      last_modified_at:
        label: "Dernière mise à jour"
        type: datetime
        comment: "Alimente <lastmod> dans sitemap.xml. À mettre à jour à chaque révision de fond."
      author:
        label: "Auteur"
        type: text
        default: "Gilles Feliho"
      image:
        label: "Image de couverture"
        type: image
      excerpt:
        label: "Résumé (extrait)"
        type: textarea
      layout:
        hidden: true  # On cache le layout car il sera défini par défaut
      categories:
        label: "Catégories"
        type: multiselect
        options:
          values: ["Conformité", "IA Juridique", "OHADA", "Recouvrement"]

  # Configuration des Pages fixes (Accueil, Mentions Légales)
  pages:
    path: ""
    name: "Pages"
    icon: wysiwyg
    description: "Pages principales du site (Accueil, Contact, etc.)"
    _inputs:
      layout:
        label: "Modèle de page"

# On supprime la section "data_config" car nous n'utilisons plus de JSON pour le blog.
# Cela simplifie grandement la gestion.
# ======================================================
# SNIPPETS — blocs insérables depuis l'éditeur CloudCannon
# Évite de recoller du HTML brut dans les articles : le CTA devient
# un composant unique (_includes/cta.html), stylé par css/style.css.
# ======================================================
_snippets_imports:
  jekyll: true

_snippets:
  cta_gsf:
    template: jekyll_include
    inline: false
    definitions:
      include: cta.html
    preview:
      text:
        - key: title
        - "Bloc CTA GSF"
      subtext:
        - key: label
      icon: ads_click
    _inputs:
      variant:
        type: select
        label: "Emplacement"
        options:
          values: ["inline", "final"]
        comment: "inline : au fil du texte — final : bloc de fin d'article"
      theme:
        type: select
        label: "Thème"
        options:
          values: ["saisine", "grille"]
      button:
        type: select
        label: "Style du bouton"
        options:
          values: ["", "secondary"]
      eyebrow:
        type: text
        label: "Surtitre"
      title:
        type: text
        label: "Titre"
      body:
        type: textarea
        label: "Accroche"
      href:
        type: text
        label: "Destination"
        comment: "La page cible doit exister, sinon le CTA renvoie sur une 404."
      label:
        type: text
        label: "Libellé du bouton"
      mention:
        type: textarea
        label: "Mention sous le bouton"
      aria:
        type: text
        label: "Libellé accessible"
