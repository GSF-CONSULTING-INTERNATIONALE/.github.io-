[build]
  command = "jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"

# --- AJOUT STRATÉGIQUE POUR LE SEO ---
[build.processing]
  skip_node_bundling = true
[build.processing.html]
  pretty_urls = true
# -------------------------------------

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = true

# --- Anciennes URL en .html -> URL canoniques ---
# Ces pages ont reçu un `permalink:` correspondant à la canonical qu'elles
# déclaraient déjà. Leur fichier de sortie passe de `foo.html` à `foo/index.html`,
# donc les URL en .html déjà indexées ne correspondent plus à aucun fichier.
# Ces 301 les rattachent à l'URL canonique et transmettent le signal aux moteurs.

[[redirects]]
  from = "/gilles-feliho.html"
  to = "/gilles-feliho/"
  status = 301
  force = true

[[redirects]]
  from = "/politique-de-confidentialite.html"
  to = "/politique-de-confidentialite/"
  status = 301
  force = true

