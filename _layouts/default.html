<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title | default: "GSF Consulting International" }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.excerpt | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | absolute_url }}">
    <meta property="og:type" content="website">

    {% if page.seo_custom_jsonld %}
      <script type="application/ld+json">
        {{ page.seo_custom_jsonld }}
      </script>
    {% elsif page.layout != "page" %}
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GSF Consulting International",
        "url": "https://gsfconsultinginternational.com",
        "logo": "https://gsfconsultinginternational.com/uploads/logo.png",
        "email": "contact@gsfconsultinginternational.com",
        "foundingDate": "2020",
        "description": "Cabinet de conseil en stratégie, conformité financière et intelligence artificielle opérant dans l'espace OHADA.",
        "areaServed": ["OHADA", "UEMOA", "CEMAC"],
        "sameAs": ["https://www.linkedin.com/in/gilles-feliho/"],
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "contact@gsfconsultinginternational.com",
          "contactType": "customer service",
          "availableLanguage": "French"
        }
      }
      </script>
    {% endif %}

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

    <!-- ==================== FONT AWESOME (version fiable) ==================== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- ===================================================================== -->

    <style>
        #mobile-menu {
            display: none;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.95);
            padding: 1rem;
            position: absolute;
    </style>
</head>
<body>
    <!-- Le reste de ton code HTML ici -->
</body>
</html>
