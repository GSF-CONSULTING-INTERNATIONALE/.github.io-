<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title | default: "GSF Consulting International" }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.excerpt | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | absolute_url }}">
    <meta property="og:type" content="website">

    {% if page.seo_custom_jsonld %}
      <script type="application/ld+json">
        {{ page.seo_custom_jsonld }}
      </script>
    {% else %}
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GSF Consulting International",
        "url": "https://gsfconsultinginternational.com",
        "logo": "https://gsfconsultinginternational.com/uploads/logo.png",
        "email": "contact@gsfconsultinginternational.com",
        "foundingDate": "2020",
        "description": "Cabinet de conseil en stratégie, conformité financière et intelligence artificielle opérant dans l'espace OHADA.",
        "areaServed": ["OHADA", "UEMOA", "CEMAC"],
        "sameAs": [
          "https://www.linkedin.com/in/gilles-feliho/"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "contact@gsfconsultinginternational.com",
          "contactType": "customer service",
          "availableLanguage": "French"
        }
      }
      </script>
    {% endif %}

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

    <!-- ==================== FONT AWESOME (version fiable) ==================== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- ===================================================================== -->

    <style>
        #mobile-menu {
            display: none;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.95);
            padding: 1rem;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            z-index: 2100;
        }

        #mobile-menu.active {
            display: flex;
        }

        #mobile-menu-btn {
            display: none;
        }

        @media (max-width: 1024px) {
            .desktop-menu {
                display: none !important;
            }

            #mobile-menu-btn {
                display: block !important;
            }
        }
    </style>
</head>
<body>
    <!-- navbar ici (votre code existant) -->

    {{ content }}

    <footer style="margin-top: 0; padding: 40px 20px; border-top: 1px solid #06b6d4; text-align: center;">
        <p style="color: #06b6d4; font-size: 0.9rem;">© {{ 'now' | date: '%Y' }} GSF Consulting International</p>
        <p style="margin: 0 0 12px;">
            <a href="mailto:gilles.feliho@gsfconsultinginternational.com" style="color: #06b6d4; font-weight: 700;">
                gilles.feliho@gsfconsultinginternational.com
            </a>
        </p>
        <p><a href="{{ '/mentions-legales.html' | relative_url }}">Mentions légales</a></p>
    </footer>

    <script>
      const mobileBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      if (mobileBtn) {
        mobileBtn.addEventListener('click', () => mobileMenu.classList.toggle('active'));
      }
      document.querySelectorAll('#mobile-menu a').forEach(link => {
        link.addEventListener('click', () => mobileMenu.classList.remove('active'));
      });
    </script>
</body>
</html>
