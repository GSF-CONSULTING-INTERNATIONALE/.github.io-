# _config.yml — GSF Consulting International (Version Corrigée)
# Date : 2026-03-26
# ======================================================

# ===== SITE =====
title: GSF Consulting International
description: Expertise Juridique & IA en Afrique
url: "https://gsfconsultinginternational.com"
author: "Gilles Sixte Feliho"
lang: fr
timezone: "Europe/Paris"

# ===== JEKYLL BUILD =====
markdown: kramdown
highlighter: rouge
future: true

kramdown:
  input: GFM
  parse_block_html: true
  parse_inline_html: true
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate


# ===== PAGINATION =====
# 9 articles/page : valeur que analyses/index.html déclarait dans son front matter
# (bloc `pagination:` de jekyll-paginate-v2, inerte ici) et qui donne 4 pages pleines.
paginate: 9
paginate_path: "/analyses/page:num/"

# ===== COLLECTIONS =====
collections:
  posts:
    output: true
    permalink: /analyses/:title/

# ===== DEFAULTS =====
defaults:
  # Valeurs par défaut pour TOUTES les pages et fichiers
  - scope:
      path: ""
    values:
      layout: "default"

  # Valeurs par défaut spécifiques aux articles (dossier _posts)
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

  # Dossier études de cas
  - scope:
      path: "etudes-de-cas"
    values:
      layout: "default"

# ===== EXCLUSIONS BUILD =====
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - hugo.toml
  - .jekyll-cache
  - .jekyll-metadata
  - .sass-cache
  - README.md
